name: Extract TLB TOUR Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o TLB-TOUR-project.zip -d extracted
          cp -R extracted/TLB-TOUR/. .
          rm -rf extracted
          rm -f TLB-TOUR-project.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract TLB TOUR project files" || echo "No changes to commit"
          git push
